<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AES Inspection Checklist</title>
<meta name="theme-color" content="#13294B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AES Inspection">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294B; --on-navy:#FFFFFF; --amber:#E0A12B; --teal:#1E7F86; --teal-bg:#E1F1F2;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#17202B; --muted:#5B6776; --line:#D4DAE2;
  --primary:#13294B; --on-primary:#FFFFFF;
  --ok:#1D7A52; --ok-bg:#E2F2E9; --bad:#B7352A; --bad-bg:#FBE6E3; --na:#646E7A; --na-bg:#E9ECEF;
  --mid:#9A6A0E; --mid-bg:#FBF0D9; --focus:#2F6FD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0D1D36; --amber:#E8B04A; --teal:#5FC0C7; --teal-bg:#173539;
    --bg:#0F151C; --surface:#18212B; --surface-2:#1E2833; --ink:#E5EAF0; --muted:#9BA6B3; --line:#2C3847;
    --primary:#E8B04A; --on-primary:#141A21;
    --ok:#56C493; --ok-bg:#163428; --bad:#F2796A; --bad-bg:#3C201D; --na:#A3ADB9; --na-bg:#26303B;
    --mid:#E8B04A; --mid-bg:#3A2E15; --focus:#7FB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0D1D36; --amber:#E8B04A; --teal:#5FC0C7; --teal-bg:#173539;
  --bg:#0F151C; --surface:#18212B; --surface-2:#1E2833; --ink:#E5EAF0; --muted:#9BA6B3; --line:#2C3847;
  --primary:#E8B04A; --on-primary:#141A21;
  --ok:#56C493; --ok-bg:#163428; --bad:#F2796A; --bad-bg:#3C201D; --na:#A3ADB9; --na-bg:#26303B;
  --mid:#E8B04A; --mid-bg:#3A2E15; --focus:#7FB0FF;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%;display:block}
[hidden]{display:none!important}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--amber)}
.topbar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:58px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.brand b{font-size:18px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:13px;opacity:.75}
.tb-title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--on-navy);border-radius:8px;padding:6px 12px;font-size:15px;white-space:nowrap}
.save-state{font-size:13px;opacity:.8;white-space:nowrap}

main{max-width:780px;margin:0 auto;padding:18px 16px 130px}
.hero{padding:22px 0 18px}
.hero h1{font-size:clamp(30px,7vw,42px);line-height:1.1;margin:0 0 8px;font-weight:700}
.hero p{margin:0 0 18px;color:var(--muted);max-width:52ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.list-head{margin:26px 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.insp-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:14px 14px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.insp-card .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.insp-card h3{margin:0 0 2px;font-size:18px}
.card-acts{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.sub{color:var(--muted);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:600}
.empty{border:2px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted)}
.del,.x-btn{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 8px;border-radius:6px}
.del[data-armed],.x-btn[data-armed]{color:var(--bad);font-weight:700}
.x-btn.danger{color:var(--bad)}

.section{margin:0 0 22px}
.section > h2{font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section > h2 small{font-size:14px;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:16px}
textarea{resize:none;line-height:1.5;min-height:42px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
@media (max-width:560px){.fields{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;min-height:42px;text-align:left;line-height:1.25}
.chip small{display:block;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--teal)}
.chip.radio[aria-pressed="true"]::before{content:"● "}
.chip.add{border-style:dashed;border-color:var(--teal)}
.chip .cnt{display:inline-block;background:var(--teal);color:var(--surface);border-radius:999px;font-size:12px;padding:0 7px;margin-left:4px;font-weight:700}
.opt-block{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.opt-block > b{font-size:15px}
.opt-block .chip{min-height:38px;padding:6px 12px;font-size:14px}
.timerow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.op{color:var(--muted);font-weight:700}
.progress{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

details.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
details.cat > summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
details.cat[open] > summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
details.cat > summary::-webkit-details-marker{display:none}
.secno{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cat-name{flex:1;min-width:0}
.cat-name b{display:block;font-size:17px;line-height:1.3}
.cat-name span{font-size:13px;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted);flex:none}
details.cat[open] > summary .chev{transform:rotate(90deg)}
details.mini{border-bottom:1px solid var(--line)}
details.mini > summary{list-style:none;cursor:pointer;padding:10px 16px;font-size:14px;color:var(--teal);font-weight:600}
details.mini > summary::-webkit-details-marker{display:none}
.mini-body{padding:0 16px 14px;display:grid;gap:10px}
.sec-tools{display:flex;gap:4px;flex-wrap:wrap}

.item{padding:12px 14px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.item.s-ok{border-left-color:var(--ok)}
.item.s-issue{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 45%,transparent)}
.item.s-na{border-left-color:var(--na)}
.item.sub{margin-top:8px;border:1px solid var(--line);border-left-width:4px;border-radius:10px;background:var(--surface)}
.item.sub.s-ok{border-left-color:var(--ok)}
.item.sub.s-na{border-left-color:var(--na)}
.item.sub.s-issue{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 45%,var(--surface))}
.item-head{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:0;padding:2px 0 8px;text-align:left;font-size:16px;font-weight:500;line-height:1.45;color:var(--ink)}
.item-head .num{flex:none;min-width:32px;height:26px;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--teal)}
.item-head .lbl{flex:1;min-width:0}
.item-head .chev{margin-top:4px}
.item-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.item.s-na > .item-head .lbl{color:var(--muted)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px 42px}
.bdg{font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.bdg.bad,.bdg.sev-high{background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:600}
.bdg.sev-mid{background:var(--mid-bg);color:var(--mid);border-color:transparent;font-weight:600}
.bdg.sev-low{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 4px;min-height:42px;font-size:15px;font-weight:500;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button[data-v="issue"][aria-pressed="true"]{background:var(--bad);color:#fff}
.seg button[data-v="na"][aria-pressed="true"]{background:var(--na);color:var(--surface)}
.item-body{margin-top:10px;display:grid;gap:10px}
.sev{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sev > span{font-size:13px;color:var(--muted);margin-right:2px}
.sev button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;min-height:34px}
.sev button[aria-pressed="true"][data-v="low"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.sev button[aria-pressed="true"][data-v="mid"]{background:var(--mid-bg);border-color:var(--mid);color:var(--mid);font-weight:600}
.sev button[aria-pressed="true"][data-v="high"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.subs{display:grid}
.item-tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:76px;height:76px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .mk{position:absolute;right:3px;bottom:3px;background:var(--navy);color:#fff;font-size:11px;border-radius:4px;padding:0 5px;line-height:18px}
.add-photo{width:76px;height:76px;border:1.5px dashed var(--teal);border-radius:8px;background:transparent;color:var(--teal);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.add-photo svg{width:22px;height:22px}
.add-row{display:flex;gap:8px;padding:12px 14px}
.add-row input{flex:1}
.cat-foot{padding:14px 16px;background:var(--surface-2);display:grid;gap:10px;border-top:1px solid var(--line)}
.sub-h{font-size:15px;font-weight:700;margin:4px 0 0}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.mrow-top{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center}
.dims{display:grid;grid-template-columns:1fr auto 1fr auto 76px;gap:6px;align-items:center}
.dims input{text-align:center;padding:9px 4px}
.mres{font-weight:700;color:var(--teal);font-size:15px;text-align:right}
.mtotal{font-size:15px;font-weight:600;background:var(--teal-bg);border-radius:8px;padding:8px 12px}
@media (max-width:480px){.mrow-top{grid-template-columns:1fr auto}.mrow-top select{grid-column:1/-1;grid-row:2}}

.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:12px;font-weight:600;color:var(--muted);min-height:48px}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.note-box{background:var(--teal-bg);border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:15px}
.msg{font-size:14px;font-weight:600;color:var(--bad);min-height:20px}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px}
.code-input{letter-spacing:.35em;font-size:20px!important}
.user-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none;border:2px solid var(--amber)}

.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottombar-in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bottombar .meta{font-size:13px;color:var(--muted);flex:1;line-height:1.3}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.export-opt{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.export-opt h3{margin:0 0 4px;font-size:16px}
.export-opt p{margin:0 0 10px;font-size:14px;color:var(--muted)}
#sumText{font-size:14px;min-height:150px;max-height:260px;overflow:auto;resize:vertical}
.sheet-close{float:right}

.editor{position:fixed;inset:0;z-index:60;background:#0B0F14;color:#EEF2F6;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #263140}
.ed-top b{flex:1;text-align:center;font-weight:600}
.ed-top button{background:transparent;color:#EEF2F6;border:1px solid #3A4757;border-radius:8px;padding:7px 14px}
.ed-top .save{background:#E8B04A;color:#141A21;border-color:#E8B04A;font-weight:700}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#edCanvas{max-width:100%;max-height:100%;touch-action:none;background:#222;border-radius:4px}
.ed-tools{padding:10px 14px 12px;border-top:1px solid #263140;display:grid;gap:10px;max-height:46%;overflow:auto}
.ed-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{background:#18212C;border:1px solid #303C4B;color:#EEF2F6;border-radius:8px;min-width:46px;min-height:42px;padding:4px 10px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:#E8B04A;background:#2B2614;color:#F5D58E}
.tool svg{width:20px;height:20px}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid #3A4757;padding:0}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #E8B04A}
.ed-sep{width:1px;height:28px;background:#303C4B;margin:0 4px}
.editor input,.editor textarea{background:#18212C;border:1px solid #303C4B;color:#EEF2F6;border-radius:8px;padding:9px 11px;width:100%}
.ed-del{background:none;border:0;color:#F2796A;font-size:14px;padding:4px 0;text-align:left}
.ed-del[data-armed]{font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:#17202B;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.banner{background:var(--mid-bg);border:1px solid var(--mid);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

<div id="editor" class="editor" hidden role="dialog" aria-label="แก้ไขรูป">
  <div class="ed-top">
    <button type="button" data-ed="cancel">ยกเลิก</button>
    <b>วาดชี้จุดบนรูป</b>
    <button type="button" class="save" data-ed="save">บันทึกรูป</button>
  </div>
  <div class="ed-stage"><canvas id="edCanvas"></canvas></div>
  <div class="ed-tools">
    <div class="ed-row">
      <button type="button" class="tool" data-tool="arrow" aria-label="ลูกศร"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19L19 5M19 5h-8M19 5v8"/></svg></button>
      <button type="button" class="tool" data-tool="circle" aria-label="วงกลม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="12" rx="8" ry="6.5"/></svg></button>
      <button type="button" class="tool" data-tool="rect" aria-label="กรอบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button type="button" class="tool" data-tool="pen" aria-label="ปากกา"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 18c3-1 4-6 7-6s2 5 5 5 3-3 4-4"/></svg></button>
      <button type="button" class="tool" data-tool="text" aria-label="ข้อความ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg></button>
      <span class="ed-sep"></span>
      <button type="button" class="swatch" data-color="#E53935" style="background:#E53935" aria-label="สีแดง"></button>
      <button type="button" class="swatch" data-color="#FFD54F" style="background:#FFD54F" aria-label="สีเหลือง"></button>

function dataURLToBlob(u){ const [h,d]=u.split(','); const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'; const bin=atob(d); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }

function cyrb53(str, seed=0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); }
function hashCode(name, code){ let h='aes|'+normName(name)+'|'+code; for(let i=0;i<3000;i++) h=cyrb53(h,i); return h; }

const segmenter = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('th',{granularity:'word'}) : null;
function tokens(s){ return segmenter ? Array.from(segmenter.segment(s), x=>x.segment) : Array.from(s); }
function wrap(ctx, text, maxW){
  const out=[];
  for(const para of String(text||'').split('\n')){
    let line='';
    for(const tk of tokens(para)){
      const test=line+tk;
      if(ctx.measureText(test).width <= maxW){ line=test; continue; }
      if(line){ out.push(line.trimEnd()); line=''; }
      if(ctx.measureText(tk).width <= maxW){ line=tk.trimStart(); }
      else { for(const ch of tk){ if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=''; } line+=ch; } }
    }
    out.push(line);
  }
  return out;
}

/* ================= storage ================= */
const mem = {insp:new Map(), photos:new Map(), users:new Map()};
let memMode=false, dbp=null;
function openDB(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('no idb'));
    const r=indexedDB.open('aes-inspection', 2);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('insp')) d.createObjectStore('insp',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'}).createIndex('insp','inspId');
      if(!d.objectStoreNames.contains('users')) d.createObjectStore('users',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d=await openDB();
  return new Promise((res,rej)=>{ const t=d.transaction(store,mode); let out; const req=fn(t.objectStore(store)); if(req) req.onsuccess=()=>{ out=req.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
}
function toMem(){ if(!memMode){ memMode=true; const b=$('#memBanner'); if(b) b.hidden=false; } }
const S = {
  async all(s){ if(!memMode){ try{ return await tx(s,'readonly',st=>st.getAll()); }catch(e){ toMem(); } } return [...mem[s].values()]; },
  async byInsp(id){ if(!memMode){ try{ return await tx('photos','readonly',st=>st.index('insp').getAll(id)); }catch(e){ toMem(); } } return [...mem.photos.values()].filter(p=>p.inspId===id); },
  async put(s,v){ mem[s].set(v.id,v); if(!memMode){ try{ await tx(s,'readwrite',st=>st.put(v)); }catch(e){ toMem(); } } },
  async del(s,k){ mem[s].delete(k); if(!memMode){ try{ await tx(s,'readwrite',st=>st.delete(k)); }catch(e){ toMem(); } } }
};

    safetyEq:'', safetyItems:[], safetyNote:'', sections:[], generalNote:'', generalPhotos:[], createdAt:Date.now(), updatedAt:Date.now()};
}
function migrate(x){
  if(!x.sections){
    const secs=[];
    for(const cid of (x.cats||[])){ const cat=CAT[cid]; if(!cat) continue;
      const items=cat.items.map((label,i)=>mkItem(label,(x.items||{})[cid+':'+i]));
      ((x.custom||{})[cid]||[]).forEach(c=>items.push(mkItem(c.label,(x.items||{})[cid+':'+c.id])));
      const info=(x.catInfo||{})[cid]||{};
      secs.push({id:uid(), catId:cid, name:cat.name, label:'', items, rows:info.rows||[], qty:info.qty||'', note:info.note||''});
    }
    x.sections=secs; delete x.cats; delete x.items; delete x.custom; delete x.catInfo;
  }
  for(const k of ['workDays','docs','trainings','safetyItems','generalPhotos']) x[k]=x[k]||[];
  for(const k of ['title','site','contact','ref','inspector','workStart','workEnd','workNote','docsNote','training','trainingNote','safetyEq','safetyNote','generalNote']) x[k]=x[k]||'';
  x.v=3; return x;
}
function* allItems(x){ for(const sec of x.sections) for(const it of sec.items){ yield {sec,it,parent:null}; for(const sb of it.subs) yield {sec,it:sb,parent:it}; } }
function locate(id){ for(const r of allItems(cur)) if(r.it.id===id) return r; return null; }
function numOf(sec,it,parent){ if(parent) return (sec.items.indexOf(parent)+1)+'.'+(parent.subs.indexOf(it)+1); return String(sec.items.indexOf(it)+1); }
function secTitle(sec){ return (sec.name||'หมวดไม่มีชื่อ')+(sec.label?' ('+sec.label+')':''); }
function secStats(sec){ let done=0,total=0,issues=0; for(const it of sec.items) for(const x of [it,...it.subs]){ total++; if(x.status) done++; if(x.status==='issue') issues++; } return {done,total,issues}; }
function inspStats(x){
  let issues=0,high=0,mid=0,low=0,ok=0,done=0,total=0,photos=(x.generalPhotos||[]).length;
  for(const {it} of allItems(x)){ total++; if(it.status) done++; if(it.status==='ok') ok++; if(it.status==='issue'){ issues++; if(it.sev==='high') high++; else if(it.sev==='mid') mid++; else if(it.sev==='low') low++; } photos+=it.photos.length; }
  return {issues,high,mid,low,ok,done,total,photos};
}
function rowCalc(r){ const w=num(r.w), l=num(r.l), n=num(r.n)||1; if(w&&l) return {v:w*l*n,u:'ตร.ม.'}; if(w||l) return {v:(w||l)*n,u:'ม.'}; return null; }
function secTotals(sec){ let area=0,len=0; (sec.rows||[]).forEach(r=>{ const c=rowCalc(r); if(!c) return; if(c.u==='ตร.ม.') area+=c.v; else len+=c.v; }); return {area,len}; }
function totalsText(t){ const a=[]; if(t.area) a.push(fmt(t.area)+' ตร.ม.'); if(t.len) a.push(fmt(t.len)+' ม.'); return a.join(' + '); }
function rowText(r){ const c=rowCalc(r); const dims=[r.w,r.l].filter(Boolean); let t=(r.loc||'ไม่ระบุตำแหน่ง')+(r.level?' ['+r.level+']':''); if(dims.length) t+=': '+dims.join(' x ')+(num(r.n)>1?' x '+r.n+' จุด':'')+(c?' = '+fmt(c.v)+' '+c.u:''); return t; }
function condLines(x){
  const L=[];
  const wt=[x.workDays.join(', '), (x.workStart||x.workEnd)?('เวลา '+(x.workStart||'?')+'–'+(x.workEnd||'?')):'', x.workNote].filter(Boolean).join(' | '); if(wt) L.push(['วันเวลาทำงาน',wt]);
  const dc=[x.docs.join(', '), x.docsNote].filter(Boolean).join(' | '); if(dc) L.push(['เอกสารที่ต้องใช้',dc]);
  const tr=[x.training?OPTS.training[x.training]:'', x.trainings.join(', '), x.trainingNote].filter(Boolean).join(' | '); if(tr) L.push(['การอบรม',tr]);
  const se=[x.safetyEq?OPTS.safetyEq[x.safetyEq]:'', x.safetyItems.length?'มี: '+x.safetyItems.join(', '):'', x.safetyNote].filter(Boolean).join(' | '); if(se) L.push(['อุปกรณ์ Safety หน้างาน',se]);
  return L;
}

function setSaveState(t){ const el=$('#saveState'); if(el) el.textContent=t; }

async function flush(){
  clearTimeout(saveTimer); saveTimer=null; if(!cur) return;
  await S.put('insp', JSON.parse(JSON.stringify(cur)));
  const i=list.findIndex(x=>x.id===cur.id); if(i>=0) list[i]=cur; else list.push(cur);
  setSaveState(memMode?'เก็บชั่วคราว':'บันทึกแล้ว');
}

function authMsg(m){ const el=$('#authMsg'); if(el) el.textContent=m; }
function setSession(u, remember){ ssSet('aes-user',u.id); lsSet('aes-user', remember?u.id:null); me=u; histQuery=''; renderHome(); }
async function doRegister(){
  const name=$('#rName').value.trim().replace(/\s+/g,' '), code=$('#rCode').value.trim(), code2=$('#rCode2').value.trim();
  if(!name){ authMsg('กรอกชื่อผู้ใช้'); $('#rName').focus(); return; }
  if(!CODE_RE.test(code)){ authMsg('รหัสต้องมี 6 ตัว เป็นตัวเลขหรือตัวอักษรภาษาอังกฤษ'); $('#rCode').focus(); return; }
  if(code!==code2){ authMsg('รหัสยืนยันไม่ตรงกัน'); $('#rCode2').focus(); return; }
  const ex=users.find(u=>normName(u.name)===normName(name));
  if(ex && ex.codeHash){ authMsg('ชื่อนี้สมัครไว้แล้วในเครื่องนี้ ให้ไปที่ “เข้าสู่ระบบ” หรือใช้ชื่ออื่น'); return; }
  const u=ex||{id:uid(), created:Date.now()};
  Object.assign(u,{name, position:$('#rPos').value.trim(), phone:$('#rPhone').value.trim(), codeHash:hashCode(name,code)}); delete u.pin;
  if(!ex) users.push(u);
  await S.put('users',u); toast('สมัครเรียบร้อย'); setSession(u,true);
}
function doLogin(){
  if(Date.now()<lockUntil){ authMsg('ใส่รหัสผิดหลายครั้ง กรุณารอ '+Math.ceil((lockUntil-Date.now())/1000)+' วินาที'); return; }
  const name=$('#lName').value, code=$('#lCode').value.trim();
  if(!name.trim()||!code){ authMsg('กรอกชื่อและรหัส 6 ตัว'); return; }
  const u=users.find(x=>normName(x.name)===normName(name));
  if(u && !u.codeHash){ authTab='register'; renderAuth({name:u.name, msg:'บัญชีนี้มาจากเวอร์ชันก่อน กรุณาตั้งรหัส 6 ตัวใหม่ งานตรวจเดิมยังอยู่ครบ'}); return; }
  if(!u || u.codeHash!==hashCode(u.name,code)){
    fails++; if(fails>=5){ fails=0; lockUntil=Date.now()+30000; }
    authMsg('ชื่อหรือรหัส 6 ตัวไม่ตรงกับที่สมัครไว้'); $('#lCode').value=''; $('#lCode').focus(); return;
  }
  fails=0; setSession(u, $('#lRemember').checked);
}
function logout(){ ssSet('aes-user',null); lsSet('aes-user',null); me=null; cur=null; authTab='login'; renderAuth(); }

async function saveProfile(){
  const name=$('#pName').value.trim().replace(/\s+/g,' '); const curc=$('#pCur').value.trim(), nc=$('#pNew').value.trim(), nc2=$('#pNew2').value.trim();
  if(!name){ authMsg('กรอกชื่อผู้ใช้'); return; }
  const nameChanged=normName(name)!==normName(me.name);
  if(nameChanged||nc){
    if(me.codeHash!==hashCode(me.name,curc)){ authMsg('รหัสปัจจุบันไม่ถูกต้อง'); $('#pCur').focus(); return; }
    if(nc && !CODE_RE.test(nc)){ authMsg('รหัสใหม่ต้องมี 6 ตัว เป็นตัวเลขหรือตัวอักษรภาษาอังกฤษ'); return; }
    if(nc && nc!==nc2){ authMsg('รหัสใหม่และรหัสยืนยันไม่ตรงกัน'); return; }
    if(nameChanged && users.some(u=>u!==me && normName(u.name)===normName(name))){ authMsg('ชื่อนี้มีผู้ใช้แล้วในเครื่องนี้'); return; }
    me.codeHash=hashCode(name, nc||curc);
  }
  me.name=name; me.position=$('#pPos').value.trim(); me.phone=$('#pPhone').value.trim();
  await S.put('users',me); toast('บันทึกการตั้งค่าแล้ว'); renderHome();
}

  const n=numOf(sec,it,parent), open=openItems.has(it.id);
  const b=[];
  if(it.status==='issue'&&it.sev) b.push(`<span class="bdg sev-${it.sev}">${SEV[it.sev]}</span>`);
  if(it.note) b.push('<span class="bdg">มีหมายเหตุ</span>');
  if(it.photos.length) b.push(`<span class="bdg">รูป ${it.photos.length}</span>`);
  if(!parent && it.subs.length){ const iss=it.subs.filter(s=>s.status==='issue').length; b.push(`<span class="bdg${iss?' bad':''}">จุดย่อย ${it.subs.length}${iss?' | ปัญหา '+iss:''}</span>`); }
  const seg=v=>`<button type="button" data-act="status" data-id="${it.id}" data-v="${v}" aria-pressed="${it.status===v}">${ST[v]}</button>`;
  return `<div class="item${it.status?' s-'+it.status:''}${parent?' sub':''}" id="it-${it.id}">
    <button type="button" class="item-head" data-act="toggleitem" data-id="${it.id}" aria-expanded="${open}">

function mrowHTML(sid, r){
  const c=rowCalc(r);
  const lv=['<option value="">ระดับ / พื้นที่</option>'].concat(LEVELS.map(l=>`<option ${r.level===l?'selected':''}>${esc(l)}</option>`)).join('');
  const a=`data-msec="${sid}" data-mrow="${r.id}"`;
  return `<div class="mrow" id="mr-${r.id}">
    <div class="mrow-top">
      <input type="text" ${a} data-m="loc" value="${esc(r.loc)}" placeholder="ตำแหน่ง เช่น หลังคาโซน A">
      <select ${a} data-m="level" aria-label="ระดับพื้นที่ทำงาน">${lv}</select>
      <button type="button" class="x-btn" data-act="delrow" data-sec="${sid}" data-row="${r.id}">ลบ</button>
    </div>
    <div class="dims">
      <input type="text" inputmode="decimal" ${a} data-m="w" value="${esc(r.w)}" placeholder="กว้าง ม." aria-label="ความกว้าง (เมตร)">
      <span class="op">×</span>
      <input type="text" inputmode="decimal" ${a} data-m="l" value="${esc(r.l)}" placeholder="ยาว ม." aria-label="ความยาว (เมตร)">
      <span class="op">×</span>
      <input type="text" inputmode="numeric" ${a} data-m="n" value="${esc(r.n)}" placeholder="จุด" aria-label="จำนวนจุด">
    </div>
    <div class="mres" id="mres-${r.id}">${c?'= '+fmt(c.v)+' '+c.u:'ใส่กว้าง × ยาว (หรือยาวอย่างเดียวสำหรับงานเป็นเมตร)'}</div>
  </div>`;
}
function secSummaryHTML(sec){ const st=secStats(sec); return `<span class="pill">${st.done}/${st.total}</span>${st.issues?`<span class="pill bad">ปัญหา ${st.issues}</span>`:''}`; }

      <div class="chips">${chips}</div>

      ${cur.sections.length?`<div class="progress" id="progress">${progressHTML()}</div>${cur.sections.map(secHTML).join('')}`:

function refreshCounts(){
  const p=$('#progress'); if(p) p.innerHTML=progressHTML();
  const b=$('#bbMeta'); if(b) b.innerHTML=bottomMeta();
  for(const sec of cur.sections){ const el=$('#cs-'+sec.id); if(el) el.innerHTML=secSummaryHTML(sec); }
}
function refreshItem(id){
  const r=locate(id); if(!r) return; const top=r.parent||r.it;
  const el=document.getElementById('it-'+top.id); if(!el) return;
  const tmp=document.createElement('div'); tmp.innerHTML=itemHTML(r.sec,top,null);
  const n=tmp.firstElementChild; el.replaceWith(n); n.querySelectorAll('textarea').forEach(autogrow);
  refreshCounts();
}
function updateTotal(sid){ const sec=cur.sections.find(s=>s.id===sid); const el=$('#mt-'+sid); if(!el||!sec) return; const t=totalsText(secTotals(sec)); el.hidden=!t; el.textContent='รวม '+t; }
function autogrow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
function scrollToEl(id){ requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})); }

async function openInspection(id){
  const x=list.find(i=>i.id===id); if(!x) return;
  cur=migrate(x); openSecs.clear(); openItems.clear(); cur.sections.forEach(s=>openSecs.add(s.id));
  for(const r of await S.byInsp(id)) photoRecs.set(r.id,r);
  renderEdit(false);
}
async function deletePhotos(ids){ for(const pid of ids){ await S.del('photos',pid); photoRecs.delete(pid); dropUrl(pid); } }
function itemPhotoIds(it){ return [...it.photos, ...(it.subs||[]).flatMap(s=>s.photos)]; }

/* ================= events ================= */
function arm(b,label){ if(b.dataset.armed) return true; const o=b.textContent; b.dataset.armed='1'; b.textContent=label; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=o; } },3000); return false; }
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.closest('#editor')) return;
  const act=b.dataset.act;
  switch(act){
    case 'authtab': authTab=b.dataset.v; renderAuth(); break;
    case 'dologin': doLogin(); break;
    case 'doregister': doRegister(); break;
    case 'logout': await flush(); logout(); break;
    case 'profile': renderProfile(); break;
    case 'saveprofile': saveProfile(); break;
    case 'delaccount': {
      if(!arm(b,'แตะอีกครั้ง: ลบบัญชีและงานทั้งหมด')) return;
      for(const x of list.filter(i=>i.userId===me.id)){ await deletePhotos((await S.byInsp(x.id)).map(r=>r.id)); await S.del('insp',x.id); }
      list=list.filter(i=>i.userId!==me.id); users=users.filter(u=>u.id!==me.id); await S.del('users',me.id); toast('ลบบัญชีแล้ว'); logout(); break; }
    case 'backup': runBusy(b,'กำลังเตรียมไฟล์…',exportBackup); break;
    case 'restore': { const fi=$('#restoreInput'); fi.value=''; fi.click(); break; }
    case 'new': { const x=newInspection(); list.push(x); cur=x; await flush(); openSecs.clear(); openItems.clear(); renderEdit(false); break; }
    case 'open': openInspection(b.dataset.id); break;
    case 'home': await flush(); renderHome(); break;
    case 'delinsp': {
      if(!arm(b,'ยืนยันลบ')) return; const id=b.dataset.id;
      await deletePhotos((await S.byInsp(id)).map(r=>r.id)); await S.del('insp',id); list=list.filter(x=>x.id!==id); renderHome(); toast('ลบงานตรวจแล้ว'); break; }
    case 'dupinsp': {
      const src=list.find(x=>x.id===b.dataset.id); if(!src) return; migrate(src);
      const x=JSON.parse(JSON.stringify(src)); Object.assign(x,{id:uid(), title:(src.title||'งานตรวจ')+' (สำเนา)', date:today(), createdAt:Date.now(), updatedAt:Date.now(), generalPhotos:[], generalNote:''});
      x.sections=src.sections.map(s=>({id:uid(), catId:s.catId, name:s.name, label:s.label, items:s.items.map(i=>cloneClean(i,true)), rows:[], qty:'', note:''}));
      await S.put('insp',x); list.push(x); renderHome(); toast('ทำสำเนาแล้ว (คัดลอกข้อมูลงานและหัวข้อ ไม่รวมผลตรวจและรูป)'); break; }
    case 'addsec': {
      const c=b.dataset.cat; const sec=newSection(c); const n=cur.sections.filter(s=>s.catId===c).length;
      if(n) sec.label='ชุดที่ '+(n+1);
      cur.sections.push(sec); openSecs.add(sec.id); touch(); renderEdit(true); scrollToEl('sec-'+sec.id);
      toast('เพิ่มหมวด '+(sec.name||'กำหนดเอง')+(n?' ชุดที่ '+(n+1):'')); break; }
    case 'dupsec': {
      const i=cur.sections.findIndex(s=>s.id===b.dataset.sec); const s=cur.sections[i];
      const n=cur.sections.filter(x=>x.catId===s.catId).length;
      const c={id:uid(), catId:s.catId, name:s.name, label:'ชุดที่ '+(n+1), items:s.items.map(it=>cloneClean(it,true)), rows:[], qty:'', note:''};
      cur.sections.splice(i+1,0,c); openSecs.add(c.id); touch(); renderEdit(true); scrollToEl('sec-'+c.id); break; }
    case 'delsec': {
      if(!arm(b,'แตะอีกครั้งเพื่อลบหมวด')) return;
      const i=cur.sections.findIndex(s=>s.id===b.dataset.sec); const s=cur.sections[i];
      await deletePhotos(s.items.flatMap(itemPhotoIds)); cur.sections.splice(i,1); touch(); renderEdit(true); break; }
    case 'movesec': {
      const i=cur.sections.findIndex(s=>s.id===b.dataset.sec); const j=i+Number(b.dataset.dir);
      if(j<0||j>=cur.sections.length) return; [cur.sections[i],cur.sections[j]]=[cur.sections[j],cur.sections[i]]; touch(); renderEdit(true); scrollToEl('sec-'+b.dataset.sec); break; }
    case 'toggleitem': { const id=b.dataset.id; openItems.has(id)?openItems.delete(id):openItems.add(id); refreshItem(id); break; }
    case 'status': {
      const r=locate(b.dataset.id); if(!r) return; const it=r.it, v=b.dataset.v;
      it.status = it.status===v?'':v; if(it.status!=='issue') it.sev=''; else openItems.add(it.id);
      touch(); refreshItem(it.id); break; }
    case 'sev': { const r=locate(b.dataset.id); if(!r) return; r.it.sev = r.it.sev===b.dataset.v?'':b.dataset.v; touch(); refreshItem(r.it.id); break; }
    case 'additem': {
      const sec=cur.sections.find(s=>s.id===b.dataset.sec); const inp=$('#add-'+sec.id); const label=inp.value.trim();
      if(!label){ inp.focus(); toast('พิมพ์ชื่อหัวข้อก่อนกดเพิ่ม'); return; }
      sec.items.push(mkItem(label)); touch(); renderEdit(true); $('#add-'+sec.id)?.focus(); break; }
    case 'addsub': {
      const r=locate(b.dataset.id); if(!r) return; const it=mkItem(''); r.it.subs.push(it); openItems.add(r.it.id); openItems.add(it.id);
      touch(); refreshItem(r.it.id); document.querySelector(`[data-ilabel="${it.id}"]`)?.focus(); break; }
    case 'dupitem': {
      const r=locate(b.dataset.id); if(!r) return; const arr=r.parent?r.parent.subs:r.sec.items; const c=cloneClean(r.it,!r.parent);
      arr.splice(arr.indexOf(r.it)+1,0,c); openItems.add(c.id); touch();
      if(r.parent) refreshItem(r.parent.id); else { renderEdit(true); scrollToEl('it-'+c.id); }
      toast('เพิ่มหัวข้อเดียวกันแล้ว'); break; }
    case 'delitem': {
      if(!arm(b,'แตะอีกครั้งเพื่อลบ')) return;
      const r=locate(b.dataset.id); if(!r) return; const arr=r.parent?r.parent.subs:r.sec.items;
      await deletePhotos(itemPhotoIds(r.it)); arr.splice(arr.indexOf(r.it),1); touch();
      if(r.parent) refreshItem(r.parent.id); else renderEdit(true); break; }
    case 'addphoto': { pendingTarget=b.dataset.key; const fi=$('#fileInput'); fi.value=''; fi.click(); break; }
    case 'editphoto': openEditor(b.dataset.id); break;
    case 'opt': { const f=b.dataset.field, v=b.dataset.v; const arr=cur[f]||(cur[f]=[]); const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); b.setAttribute('aria-pressed', i<0); touch(); break; }
    case 'radio': { const f=b.dataset.field, v=b.dataset.v; cur[f]=cur[f]===v?'':v; b.parentElement.querySelectorAll('[data-act="radio"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===cur[f])); touch(); break; }
    case 'addrow': {
      const sec=cur.sections.find(s=>s.id===b.dataset.sec); const rows=(sec.rows ||= []); const last=rows[rows.length-1];
      const r={id:'r'+uid(), loc:'', level:last?last.level:'', w:'', l:'', n:''}; rows.push(r); touch();
      const box=$('#mrows-'+sec.id); const tmp=document.createElement('div'); tmp.innerHTML=mrowHTML(sec.id,r); box.appendChild(tmp.firstElementChild); box.lastElementChild.querySelector('input').focus(); break; }
    case 'delrow': {
      const sec=cur.sections.find(s=>s.id===b.dataset.sec); const r=sec.rows.find(x=>x.id===b.dataset.row);
      if(r && (r.w||r.l||r.loc) && !arm(b,'ยืนยัน')) return;
      sec.rows=sec.rows.filter(x=>x.id!==b.dataset.row); $('#mr-'+b.dataset.row)?.remove(); updateTotal(sec.id); touch(); break; }
    case 'export': await flush(); openExport(); break;
    case 'closeexport': closeExport(); break;
    case 'copy': copySummary(); break;
    case 'pdf': runBusy(b,'กำลังสร้าง PDF…',exportPdf); break;
    case 'img': runBusy(b,'กำลังสร้างรูปรายงาน…',exportImages); break;
    case 'photos': runBusy(b,'กำลังเตรียมรูป…',exportPhotos); break;
    case 'sharefile': shareFile(b.dataset.key); break;
    case 'dlfile': runBusy(b,'กำลังเตรียมไฟล์…',()=>downloadFile(b.dataset.key)); break;
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='histSearch'){ histQuery=t.value; $('#histList').innerHTML=histCards(); return; }
  if(!cur) return;
  if(t.matches('textarea')) autogrow(t);
  const d=t.dataset;

async function resizeImage(file,max){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); return {blob:await canvasBlob(c,0.86),w,h}; }
  finally{ URL.revokeObjectURL(url); }
}
$('#fileInput').addEventListener('change', async e=>{

  const ids=[];

function drawShape(ctx,s){
  ctx.save(); ctx.strokeStyle=s.c; ctx.fillStyle=s.c; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=(s.w||6)*0.9;
  if(s.t==='pen'){ ctx.lineWidth=s.w; ctx.beginPath(); s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
  else if(s.t==='arrow'){ ctx.lineWidth=s.w; const a=Math.atan2(s.y2-s.y1,s.x2-s.x1), hl=s.w*4.5;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2-Math.cos(a)*hl*0.6, s.y2-Math.sin(a)*hl*0.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x2,s.y2); ctx.lineTo(s.x2-hl*Math.cos(a-0.45), s.y2-hl*Math.sin(a-0.45)); ctx.lineTo(s.x2-hl*Math.cos(a+0.45), s.y2-hl*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); }
  else if(s.t==='circle'){ ctx.lineWidth=s.w; ctx.beginPath(); ctx.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.abs(s.x2-s.x1)/2||1,Math.abs(s.y2-s.y1)/2||1,0,0,Math.PI*2); ctx.stroke(); }
  else if(s.t==='rect'){ ctx.lineWidth=s.w; ctx.strokeRect(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.abs(s.x2-s.x1),Math.abs(s.y2-s.y1)); }
  else if(s.t==='text'){ ctx.shadowBlur=0; ctx.font=`700 ${s.size}px Sarabun, "Noto Sans Thai", sans-serif`; ctx.textBaseline='middle';
    const m=ctx.measureText(s.text), pad=s.size*0.3; ctx.fillStyle='rgba(10,14,20,.72)'; ctx.fillRect(s.x-pad, s.y-s.size*0.75, m.width+pad*2, s.size*1.5); ctx.fillStyle=s.c; ctx.fillText(s.text, s.x, s.y); }
  ctx.restore();
}
function draw(){ if(!ed.img) return; cx.clearRect(0,0,cv.width,cv.height); cx.drawImage(ed.img,0,0,cv.width,cv.height); ed.shapes.forEach(s=>drawShape(cx,s)); if(ed.draft) drawShape(cx,ed.draft); }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; }
cv.addEventListener('pointerdown', e=>{
  if(!ed.img) return; e.preventDefault(); const p=pt(e), w=lw();
  if(ed.tool==='text'){ const t=$('#edText').value.trim(); if(!t){ toast('พิมพ์ข้อความก่อน แล้วแตะตำแหน่งบนรูป'); $('#edText').focus(); return; } ed.shapes.push({t:'text',c:ed.color,size:w*7,x:p.x,y:p.y,text:t}); $('#edText').value=''; draw(); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  ed.draft = ed.tool==='pen' ? {t:'pen',c:ed.color,w,pts:[[p.x,p.y]]} : {t:ed.tool,c:ed.color,w,x1:p.x,y1:p.y,x2:p.x,y2:p.y};
});
cv.addEventListener('pointermove', e=>{ if(!ed.draft) return; const p=pt(e); if(ed.draft.t==='pen') ed.draft.pts.push([p.x,p.y]); else { ed.draft.x2=p.x; ed.draft.y2=p.y; } draw(); });
function endDraft(){ if(!ed.draft) return; const d=ed.draft; ed.draft=null; const big=d.t==='pen'?d.pts.length>2:Math.hypot(d.x2-d.x1,d.y2-d.y1)>lw()*2; if(big) ed.shapes.push(d); draw(); }

$('#editor').addEventListener('click', async e=>{

function collectPhotos(){
  const out=[];
  cur.sections.forEach((sec,si)=>{ for(const it of sec.items) for(const [x,par] of [[it,null],...it.subs.map(s=>[s,it])]) for(const pid of x.photos){ const rec=photoRecs.get(pid); if(rec) out.push({rec,sec,si,num:numOf(sec,x,par),label:x.label,state:x}); } });
  for(const pid of cur.generalPhotos){ const rec=photoRecs.get(pid); if(rec) out.push({rec,sec:null,si:-1,num:'',label:'ภาพรวมหน้างาน',state:null}); }
  out.forEach((p,i)=>p.n=i+1); return out;
}
function picNums(x,photos){ return x.photos.map(pid=>photos.find(p=>p.rec.id===pid)?.n).filter(Boolean); }
function statusText(s){ if(!s||!s.status) return ''; return ST[s.status]+(s.status==='issue'&&s.sev?' ('+SEV[s.sev]+')':''); }
function photoTitle(p){ return 'รูปที่ '+p.n+'  '+(p.sec?`${p.si+1}. ${secTitle(p.sec)} ข้อ ${p.num} ${p.label}`:p.label); }
function buildSummary(){
  const st=inspStats(cur), photos=collectPhotos(), L=[];
  L.push('[รายงานสำรวจหน้างาน AES]');
  L.push('ลูกค้า/โครงการ: '+(cur.title||'-')); if(cur.site) L.push('สถานที่: '+cur.site);
  L.push('วันที่ตรวจ: '+(thDate(cur.date)||'-')+(cur.inspector?'  ผู้ตรวจ: '+cur.inspector:''));
  if(cur.contact) L.push('ผู้ติดต่อ: '+cur.contact); if(cur.ref) L.push('อ้างอิง: '+cur.ref);
  for(const [k,v] of condLines(cur)) L.push(k+': '+v);
  L.push(`สรุป: พบปัญหา ${st.issues} จุด`+(st.issues?` (เร่งด่วน ${st.high}, ปานกลาง ${st.mid}, เล็กน้อย ${st.low})`:'')+`, ปกติ ${st.ok} ข้อ, รูป ${st.photos} รูป`);
  cur.sections.forEach((sec,si)=>{
    L.push(''); L.push(`■ ${si+1}. ${secTitle(sec)}`);
    const okN=[], pend=[];
    for(const it of sec.items) for(const [x,par] of [[it,null],...it.subs.map(s=>[s,it])]){
      const n=numOf(sec,x,par), pics=picNums(x,photos), pt=pics.length?' [รูป '+pics.join(', ')+']':'';
      if(x.status==='issue'){ L.push(`⚠ ${n} ${x.label}`+(x.sev?' ('+SEV[x.sev]+')':'')+pt); if(x.note) L.push('   - '+x.note.replace(/\n/g,'\n     ')); }
      else if(x.status==='ok'){ if(x.note||pics.length) L.push(`✓ ${n} ${x.label}${pt}${x.note?': '+x.note:''}`); else okN.push(n); }
      else if(x.status==='na'){ if(x.note) L.push(`– ${n} ${x.label} (ไม่เกี่ยว): ${x.note}`); }
      else { if(x.note||pics.length) L.push(`• ${n} ${x.label}${pt}${x.note?': '+x.note:''}`); else pend.push(n); }
    }
    if(okN.length) L.push('✓ ปกติ ข้อ '+okN.join(', '));
    if(pend.length) L.push('… ยังไม่ได้ตรวจ ข้อ '+pend.join(', '));
    if(sec.rows?.length){ L.push('ปริมาณงาน / พื้นที่ทำงาน:'); sec.rows.forEach(r=>L.push('   - '+rowText(r))); const tt=totalsText(secTotals(sec)); if(tt) L.push('   รวม '+tt); }
    if(sec.qty) L.push('ปริมาณอื่น ๆ: '+sec.qty); if(sec.note) L.push('หมายเหตุ: '+sec.note);
  });
  if(cur.generalNote){ L.push(''); L.push('■ สรุปจากหน้างาน'); L.push(cur.generalNote); }
  return L.join('\n');
}

  function heading(text,right){ ensure(130); y+=14; ctx.fillStyle='#E6EEF0'; ctx.fillRect(M,y,CW,58); ctx.fillStyle='#1E7F86'; ctx.fillRect(M,y,8,58);
    ctx.font=`500 19px ${PF}`; const rw=right?ctx.measureText(right).width:0;
    ctx.fillStyle='#13294B'; ctx.font=`700 27px ${PF}`; let t=text; while(ctx.measureText(t).width>CW-60-rw && t.length>4) t=t.slice(0,-2); if(t!==text) t+='…'; ctx.fillText(t,M+26,y+39);
    if(right){ ctx.font=`500 19px ${PF}`; ctx.fillStyle='#3A4654'; ctx.fillText(right,M+CW-20-rw,y+37); } y+=76; }
  function marker(color,indent,hollow){ ensure(40); if(hollow){ ctx.strokeStyle=color; ctx.lineWidth=2; ctx.strokeRect(M+indent-27,y+13,12,12); } else { ctx.fillStyle=color; ctx.fillRect(M+indent-28,y+12,14,14); } }
  async function photoGrid(list){
    const gap=30, colW=(CW-gap)/2;
    for(let i=0;i<list.length;i+=2){
      const prep=await Promise.all(list.slice(i,i+2).map(async p=>{ const img=await blobImg(p.rec.full); let iw=colW, ih=img.naturalHeight*colW/img.naturalWidth; if(ih>440){ ih=440; iw=img.naturalWidth*440/img.naturalHeight; }
        const cap=photoTitle(p)+(p.state&&p.state.status?' ['+statusText(p.state)+']':'')+(p.rec.caption?'\n'+p.rec.caption:''); ctx.font=`400 19px ${PF}`; return {img,iw,ih,lines:wrap(ctx,cap,colW)}; }));
      const rowH=Math.max(...prep.map(p=>p.ih+14+p.lines.length*28))+26; ensure(rowH);
      prep.forEach((p,j)=>{ const x=M+j*(colW+gap); ctx.fillStyle='#EEF1F4'; ctx.fillRect(x,y,colW,p.ih); ctx.drawImage(p.img,x+(colW-p.iw)/2,y,p.iw,p.ih);
        p.lines.forEach((l,k)=>{ ctx.font=k===0?`600 19px ${PF}`:`400 19px ${PF}`; ctx.fillStyle=k===0?'#13294B':'#17202B'; ctx.fillText(l,x,y+p.ih+34+k*28); }); });
      y+=rowH;
    }
  }
  newPage();
  ctx.fillStyle='#13294B'; ctx.fillRect(M,y,CW,150); ctx.fillStyle='#E0A12B'; ctx.fillRect(M,y,10,150);
  ctx.fillStyle='#fff'; ctx.font=`700 46px ${PF}`; ctx.fillText('รายงานสำรวจหน้างาน',M+40,y+68);
  ctx.font=`400 23px ${PF}`; ctx.fillStyle='#F2D28C'; ctx.fillText('Site Inspection Report  |  ASTEC Engineering Service',M+40,y+112); y+=180;
  for(const [k,v] of [['ลูกค้า / โครงการ',cur.title],['สถานที่',cur.site],['วันที่ตรวจ',thDate(cur.date)],['ผู้ตรวจ',cur.inspector],['ผู้ติดต่อฝั่งลูกค้า',cur.contact],['เลขอ้างอิง',cur.ref]].filter(r=>r[1])){
    ctx.font=`600 23px ${PF}`; const lines=wrap(ctx,v,CW-300); ensure(lines.length*34+12);
    ctx.fillStyle='#5B6776'; ctx.font=`500 21px ${PF}`; ctx.fillText(k,M,y+24); ctx.fillStyle='#17202B'; ctx.font=`600 23px ${PF}`; lines.forEach((l,i)=>ctx.fillText(l,M+300,y+24+i*34));
    y+=lines.length*34+12; ctx.fillStyle='#E3E7EC'; ctx.fillRect(M,y-4,CW,1);
  }
  y+=18; ensure(110); ctx.fillStyle='#F3F5F8'; ctx.fillRect(M,y,CW,96);
  const boxes=[['พบปัญหา',st.issues,'#B7352A'],['เร่งด่วน',st.high,'#B7352A'],['ปานกลาง',st.mid,'#9A6A0E'],['ปกติ',st.ok,'#1D7A52'],['รูปถ่าย',st.photos,'#13294B']]; const bw=CW/boxes.length;
  boxes.forEach(([k,v,col],i)=>{ const x=M+i*bw+24; ctx.fillStyle=col; ctx.font=`700 40px ${PF}`; ctx.fillText(String(v),x,y+52); ctx.fillStyle='#5B6776'; ctx.font=`500 19px ${PF}`; ctx.fillText(k,x,y+82); });
  y+=124;
  para('หมวดงาน: '+(cur.sections.map((s,i)=>(i+1)+'. '+secTitle(s)).join(', ')||'-'),{size:22,color:'#3A4654'});
  const cl=condLines(cur);
  if(cl.length){ y+=10; ensure(60); ctx.fillStyle='#13294B'; ctx.font=`700 25px ${PF}`; ctx.fillText('เงื่อนไขการเข้าทำงาน',M,y+26); y+=44; for(const [k,v] of cl){ para(k+': '+v,{size:21}); y+=2; } }

  for(const [si,sec] of cur.sections.entries()){
    const cs=secStats(sec); heading(`${si+1}. ${secTitle(sec)}`, `ตรวจ ${cs.done}/${cs.total}  ปัญหา ${cs.issues}`);
    const okL=[], pendL=[];
    for(const it of sec.items) for(const [x,par] of [[it,null],...it.subs.map(s=>[s,it])]){
      const n=numOf(sec,x,par), ind=par?60:28, pics=picNums(x,photos), pt=pics.length?'  (รูป '+pics.join(', ')+')':'';
      const lbl=`${n}  ${x.label||'(ไม่มีชื่อหัวข้อ)'}`;
      if(x.status==='issue'){ marker('#B7352A',ind); para(lbl+(x.sev?'  ['+SEV[x.sev]+']':'')+pt,{weight:600,indent:ind}); if(x.note) para(x.note,{size:21,indent:ind,color:'#3A4654'}); y+=6; }
      else if(x.status==='ok' && (x.note||pics.length)){ marker('#1D7A52',ind); para(lbl+'  [ปกติ]'+pt,{size:22,indent:ind}); if(x.note) para(x.note,{size:21,indent:ind,color:'#3A4654'}); y+=4; }
      else if(x.status==='ok') okL.push(lbl);
      else if(x.status==='na'){ if(x.note){ marker('#8A939E',ind); para(lbl+'  [ไม่เกี่ยว]',{size:22,indent:ind,color:'#5B6776'}); para(x.note,{size:21,indent:ind,color:'#5B6776'}); y+=4; } }
      else if(x.note||pics.length){ marker('#8A939E',ind,true); para(lbl+'  [ยังไม่ระบุผล]'+pt,{size:22,indent:ind}); if(x.note) para(x.note,{size:21,indent:ind,color:'#3A4654'}); y+=4; }
      else pendL.push(lbl);
    }
    if(okL.length) para('ปกติ: '+okL.join(', '),{size:21,color:'#1D7A52'});
    if(pendL.length) para('ยังไม่ได้ตรวจ: '+pendL.join(', '),{size:21,color:'#7A8491'});
    if(sec.rows?.length){ y+=4; para('ปริมาณงาน / พื้นที่ทำงาน',{size:22,weight:700,color:'#13294B'}); sec.rows.forEach(r=>para('- '+rowText(r),{size:21,indent:16})); const tt=totalsText(secTotals(sec)); if(tt) para('รวม '+tt,{size:22,weight:700,color:'#1E7F86',indent:16}); }
    if(sec.qty) para('ปริมาณอื่น ๆ: '+sec.qty,{size:22,weight:600});
    if(sec.note) para('หมายเหตุ / ข้อเสนอแนะ: '+sec.note,{size:22});
    const cp=photos.filter(p=>p.sec===sec); if(cp.length){ y+=12; await photoGrid(cp); }
  }
  const gp=photos.filter(p=>!p.sec);
  if(cur.generalNote||gp.length){ heading('ภาพรวมและหมายเหตุ'); if(cur.generalNote) para(cur.generalNote,{size:22}); if(gp.length){ y+=12; await photoGrid(gp); } }
  pages.forEach((p,i)=>{ const g=p.getContext('2d'); g.font=`400 18px ${PF}`; g.fillStyle='#7A8491'; g.fillText('ASTEC Engineering Service',M,H-40); const t=`หน้า ${i+1}/${pages.length}`; g.fillText(t,W-M-g.measureText(t).width,H-40); });
  return pages;
}
const baseName=()=>`${safeName(cur.title)}_${cur.date||today()}`;
async function exportPdf(btn){
  if(!window.jspdf){ toast('โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); return; }
  const pages=await buildPages(); const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  pages.forEach((p,i)=>{ if(i) doc.addPage(); doc.addImage(p.toDataURL('image/jpeg',0.84),'JPEG',0,0,210,297); });
  offer([{filename:`Inspection_${baseName()}.pdf`, blob:doc.output('blob')}], btn);
}
async function exportImages(btn){
  const pages=await buildPages(); const files=[];
  for(const [i,p] of pages.entries()) files.push({filename:`Inspection_${baseName()}_หน้า${i+1}.jpg`, blob:await canvasBlob(p,0.9)});
  offer(files, btn, `Inspection_${baseName()}_รูปรายงาน.zip`);
}
async function labeledPhoto(p){
  const img=await blobImg(p.rec.full); const W=img.naturalWidth, IH=img.naturalHeight;
  const fs=Math.max(18,Math.round(W/46)), pad=Math.round(fs*0.9), lh=Math.round(fs*1.45);
  const c=document.createElement('canvas'), ctx=c.getContext('2d'), maxW=W-pad*2, L=[];
  const add=(text,f,col)=>{ ctx.font=f; wrap(ctx,text,maxW).forEach(t=>L.push({t,f,c:col})); };
  add((cur.title||'')+(cur.site?'  |  '+cur.site:''), `600 ${fs}px ${PF}`, '#F2D28C');
  add(photoTitle(p)+(p.state&&p.state.status?'  ['+statusText(p.state)+']':''), `700 ${fs}px ${PF}`, '#FFFFFF');
  const note=[p.rec.caption, p.state&&p.state.note].filter(Boolean).join('\n'); if(note) add(note, `400 ${fs}px ${PF}`, '#E6EBF1');
  add(thDate(cur.date)+(cur.inspector?'  ผู้ตรวจ '+cur.inspector:'')+(cur.ref?'  |  '+cur.ref:''), `400 ${Math.round(fs*0.85)}px ${PF}`, '#AEB9C6');
  const barH=pad*2+L.length*lh; c.width=W; c.height=IH+barH; ctx.drawImage(img,0,0);
  ctx.fillStyle='#13294B'; ctx.fillRect(0,IH,W,barH); ctx.fillStyle='#E0A12B'; ctx.fillRect(0,IH,W,Math.max(3,Math.round(fs/6)));
  L.forEach((ln,i)=>{ ctx.font=ln.f; ctx.fillStyle=ln.c; ctx.fillText(ln.t,pad,IH+pad+fs+i*lh); });
  return canvasBlob(c,0.9);
}
async function exportPhotos(btn){
  try{ await document.fonts.load('700 24px Sarabun'); }catch(e){}
  const photos=collectPhotos(); if(!photos.length){ toast('ยังไม่มีรูปในงานตรวจนี้'); return; }
  const files=[]; for(const p of photos) files.push({filename:`${String(p.n).padStart(2,'0')}_${safeName((p.num?'ข้อ'+p.num+' ':'')+p.label).slice(0,40)}.jpg`, blob:await labeledPhoto(p)});
  offer(files, btn, `Photos_${baseName()}.zip`);
}

/* ================= backup / restore ================= */
async function exportBackup(btn){
  const mine=list.filter(x=>x.userId===me.id).map(migrate); const photos=[];
  for(const x of mine) for(const r of await S.byInsp(x.id)) photos.push({...r, orig:await blobToDataURL(r.orig), full:await blobToDataURL(r.full)});
  const data={app:'aes-inspection', version:3, exportedAt:new Date().toISOString(), user:{name:me.name,position:me.position,phone:me.phone}, inspections:mine, photos};
  offer([{filename:`AES-Inspection-backup_${safeName(me.name)}_${today()}.json`, blob:new Blob([JSON.stringify(data)],{type:'application/json'})}], btn);
}
$('#restoreInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f||!me) return;
  try{
    const data=JSON.parse(await f.text()); if(data.app!=='aes-inspection' || !Array.isArray(data.inspections)) throw new Error('bad');
    for(const p of (data.photos||[])){ await S.put('photos',{...p, orig:dataURLToBlob(p.orig), full:dataURLToBlob(p.full)}); }
    for(const x of data.inspections){ const y=migrate(x); y.userId=me.id; await S.put('insp',y); const i=list.findIndex(z=>z.id===y.id); if(i>=0) list[i]=y; else list.push(y); }
    toast(`นำเข้า ${data.inspections.length} งานตรวจเรียบร้อย`); renderHome();
  }catch(err){ console.error(err); toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลของแอปนี้'); }
});

/* ================= boot ================= */
(async function boot(){
  try{ list=(await S.all('insp')).map(migrate); }catch(e){ list=[]; }
  try{ users=await S.all('users'); }catch(e){ users=[]; }
  const id=ssGet('aes-user')||lsGet('aes-user'); const u=users.find(x=>x.id===id && x.codeHash);
  if(u){ me=u; renderHome(); } else renderAuth();
})();
</script>
